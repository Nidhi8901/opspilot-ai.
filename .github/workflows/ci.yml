name: OpsPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opspilot
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U opspilot -d opspilot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: postgresql+psycopg://opspilot:opspilot_ci@127.0.0.1:5432/opspilot
      AWS_REGION: ap-south-1
      AWS_DEFAULT_REGION: ap-south-1
      BEDROCK_MODEL_ID: apac.amazon.nova-lite-v1:0
      EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Compile Python
        run: python -m compileall -q backend

      - name: Initialize test database
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from backend.database import Base, engine
          import backend.models

          with engine.begin() as conn:
              conn.execute(text("CREATE EXTENSION IF NOT EXISTS vector"))

          Base.metadata.create_all(bind=engine)
          print("CI database initialized")
          PY

      - name: Start API
        run: |
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/opspilot-api.log 2>&1 &
          echo $! > /tmp/opspilot-api.pid

          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "OpsPilot API is healthy"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/opspilot-api.log
          exit 1

      - name: Run smoke tests
        run: pytest -q

      - name: Validate Docker build
        run: docker build -t opspilot-ai:ci .

      - name: Show API logs on failure
        if: failure()
        run: cat /tmp/opspilot-api.log || true
